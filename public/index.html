<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tiệm bánh Mây</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Archify end-to-end tutorial</p>
      <h1>Tiệm bánh Mây</h1>
      <p class="intro">
        Đây là app chạy thật dùng làm evidence cho các sơ đồ CURRENT. Catalog
        đã xuất hiện từ feature 03, còn checkout sẽ hoàn thiện ở các feature
        tiếp theo.
      </p>
      <section class="status" aria-labelledby="status-title">
        <h2 id="status-title">Trạng thái server</h2>
        <p id="server-status">Đang kiểm tra…</p>
      </section>
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="section-copy">
          <h2 id="catalog-title">Catalog hôm nay</h2>
          <p>Mỗi item bên dưới đều đến từ API `/api/catalog`.</p>
        </div>
        <div id="catalog-list" class="catalog-list" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
